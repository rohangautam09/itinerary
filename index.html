<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Itinerary</title>
<meta name="description" content="Offline-first travel itinerary">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Itinerary">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1 id="tripName">Loading…</h1>
      <p id="tripSub"></p>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" data-view="today" role="tab"><span class="tab-ico">◉</span><span class="tab-label">Today</span></button>
      <button class="tab" data-view="days" role="tab"><span class="tab-ico">▤</span><span class="tab-label">Days</span></button>
      <button class="tab" data-view="map" role="tab"><span class="tab-ico">◎</span><span class="tab-label">Map</span></button>
      <button class="tab" data-view="budget" role="tab"><span class="tab-ico">€</span><span class="tab-label">Budget</span></button>
      <button class="tab" data-view="prep" role="tab"><span class="tab-ico">✓</span><span class="tab-label">Prep</span></button>
    </nav>
    <div class="topbar-actions">
      <button class="btn-icon" id="btnPrint" title="Print / save as PDF" aria-label="Print">⎙</button>
      <button class="btn-icon" id="btnTheme" title="Toggle theme" aria-label="Theme">◐</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="view" id="view-today" hidden></section>
  <section class="view" id="view-days" hidden></section>
  <section class="view" id="view-map" hidden>
    <div class="map-shell">
      <div id="map"></div>
      <div class="map-filter" id="mapFilter"></div>
    </div>
  </section>
  <section class="view" id="view-budget" hidden></section>
  <section class="view" id="view-prep" hidden></section>
</main>

<div class="print-only" id="printSheet"></div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="btn-icon" data-close aria-label="Close">✕</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
